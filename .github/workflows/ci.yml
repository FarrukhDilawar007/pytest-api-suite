name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: mkdir -p reports && pytest -m smoke -v --html=reports/smoke-report.html --self-contained-html

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: reports/smoke-report.html

  regression:
    name: Regression + BDD
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    needs: smoke
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: pytest -m "regression and not contract" -v --alluredir=allure-results

      - name: Run BDD tests
        run: pytest -m bdd -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results

  contract:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: smoke
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run consumer contract tests (generates pact file)
        run: pytest -m contract tests/contract/consumer/ -v

      - name: Run provider verification
        run: pytest -m contract tests/contract/provider/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 src/ tests/ --max-line-length=120
